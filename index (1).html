<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Level Up">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Level Up System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
</style>
<style>
:root{
  /* Layout: one phone-width column. HUD on top, System-window panels in the middle, tab bar fixed at the bottom. */
  --bg:#050a14;
  --panel:#09111f;
  --panel-2:#0e1c33;
  --line:#17335c;
  --glow:#3fb1ff;
  --glow-dim:#2a7ad1;
  --halo:rgba(63,177,255,.16);
  --text:#d9e8fb;
  --mute:#8097b6;
  --good:#52e3b0;
  --bad:#ff6178;
  --gold:#ffd166;
  --f-display:'Chakra Petch',system-ui,sans-serif;
  --f-body:'Barlow',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  background-image:radial-gradient(120% 50% at 50% -8%,var(--halo),transparent 70%);
  background-repeat:no-repeat;
  color:var(--text);
  font:16px/1.45 var(--f-body);
  padding-inline:16px;
  padding-block:16px 110px;
  min-height:100%;
}
.shell{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.num,.tnum{font-variant-numeric:tabular-nums}

.eyebrow{font:600 .72rem/1 var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--glow)}
.mute{color:var(--mute)}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);padding:16px}
.panel::before,.panel::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--glow);pointer-events:none}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

/* HUD */
.hud{display:flex;flex-direction:column;gap:12px}
.hud-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.title{font:700 2rem/1 var(--f-display);letter-spacing:.02em;margin-top:6px;text-wrap:balance}
.rank{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:6px 10px;border:1px solid var(--glow);box-shadow:0 0 14px var(--halo) inset,0 0 14px var(--halo)}
.rank span{font:600 .6rem/1 var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.rank b{font:700 2rem/1.1 var(--f-display);color:var(--glow);text-shadow:0 0 12px var(--glow)}
.rank-S b,.rank-A b{color:var(--gold);text-shadow:0 0 12px var(--gold)}
.bar{height:10px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--glow-dim),var(--glow));box-shadow:0 0 12px var(--glow);transition:width .5s ease}
.bar.gold>i{background:linear-gradient(90deg,#c8962c,var(--gold));box-shadow:0 0 12px var(--gold)}
.xp-line{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mute);font-variant-numeric:tabular-nums}

/* Day header */
.day-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.day-head h2{font:600 1.35rem/1.1 var(--f-display);margin-top:6px}
.count{font:600 1.5rem/1 var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.count b{color:var(--glow)}
.count span{display:block;font:600 .62rem/1.4 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}

/* Quests */
.quests{display:flex;flex-direction:column;gap:10px}
.quest{display:grid;grid-template-columns:minmax(0,1fr) 64px;background:var(--panel);border:1px solid var(--line);transition:border-color .2s}
.quest.is-done{border-color:#1d4a45;background:#08141a}
.q-main{background:none;border:0;text-align:left;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.q-title{font:600 1.1rem/1.15 var(--f-display)}
.is-done .q-title{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line)}
.q-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font:600 .7rem/1.3 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.q-meta b{color:var(--glow)}
.is-done .q-meta b{color:var(--good)}
.q-meta i{font-style:normal}
.q-meta .weak{color:var(--gold)}
.q-sum{font-size:.93rem;color:var(--text);opacity:.85}
.q-check{border:0;border-left:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center;min-height:64px}
.q-check svg{width:26px;height:26px;stroke:var(--glow);fill:none;stroke-width:2.5;opacity:.5}
.q-check:active{background:var(--line)}
.is-done .q-check{background:#0f3a35;border-left-color:#1d4a45}
.is-done .q-check svg{stroke:var(--good);opacity:1}
.q-body{grid-column:1/-1;border-top:1px dashed var(--line);padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.q-body li,.tips li{position:relative;padding-left:18px;font-size:.95rem}
.q-body li+li{margin-top:4px}
.q-body li::before,.tips li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;background:var(--glow);transform:rotate(45deg)}
.tips{display:flex;flex-direction:column;gap:8px}
.weigh{display:flex;gap:8px}
.weigh input{flex:1;min-width:0}
.fb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.fb span{flex:1 1 100%;font-size:.85rem;color:var(--mute)}
.fb span b{color:var(--glow)}
.fb .btn{flex:1 1 0}
.field{background:var(--panel-2);border:1px solid var(--line);padding:10px 12px;min-height:44px;width:100%;border-radius:0}
.field:focus{border-color:var(--glow);outline:none;box-shadow:0 0 0 1px var(--glow)}
textarea.field{resize:vertical;min-height:84px}
.btn{background:transparent;border:1px solid var(--glow);color:var(--glow);padding:10px 16px;min-height:44px;font:600 .8rem/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase}
.btn:active{background:var(--halo)}
.btn.sm{min-height:40px;padding:8px 10px;font-size:.7rem;letter-spacing:.1em}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.filebtn{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.hint{font-size:.88rem;color:var(--mute)}
.linkbtn{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none}

/* Notices and coach */
.notices{display:flex;flex-direction:column;gap:10px}
.notice{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;border:1px solid var(--bad);background:#1a0c14;padding:12px 14px}
.notice.boss{border-color:var(--gold);background:#1b160a}
.notice.info{border-color:var(--glow);background:#0a1626}
.notice p{font-size:.92rem}
.notice .btn{margin-top:10px;min-height:40px;padding:8px 14px}
.notice strong,.coach strong{font:700 .72rem/1 var(--f-display);letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:6px;color:var(--bad)}
.notice.boss strong{color:var(--gold)}
.notice.info strong{color:var(--glow)}
.coach{border:1px solid var(--glow);background:#0a1626;padding:12px 14px}
.coach strong{color:var(--glow)}
.coach p{font-size:.92rem}
.coach.comeback{border-color:var(--gold);background:#1b160a}
.coach.comeback strong{color:var(--gold)}
.x{background:none;border:0;color:var(--mute);min-width:44px;min-height:44px;margin:-10px -10px 0 0;font-size:1.3rem}

/* Status */
.stats{display:flex;flex-direction:column;gap:14px}
.stat-row{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;gap:10px;align-items:center}
.stat-row b{font:600 .85rem/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.stat-row span{text-align:right;font:700 1.1rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv{border:1px solid var(--line);background:var(--panel);padding:12px 14px}
.kv small{display:block;font:600 .62rem/1.4 var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.kv b{font:700 1.5rem/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.sec{font:600 .78rem/1 var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--glow);margin-bottom:12px}
.chart{width:100%;height:auto;display:block}
.chart .ax{fill:var(--mute);font:10px var(--f-body)}
.chart .ln{fill:none;stroke:var(--glow);stroke-width:2}
.chart .dt{fill:var(--bg);stroke:var(--glow);stroke-width:2}
.chart .gd{stroke:var(--line);stroke-width:1}

/* Boss */
.boss-name{font:700 1.5rem/1.1 var(--f-display);margin:8px 0 4px;text-wrap:balance}
.boss-parts{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.part-top{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:4px;font-variant-numeric:tabular-nums}
.reward{margin-top:14px;font:600 .8rem/1.3 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.log{display:flex;flex-direction:column;gap:6px}
.log li{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);padding:10px 12px;font-size:.92rem;font-variant-numeric:tabular-nums}
.log .won{color:var(--gold)}
.log .lost{color:var(--mute)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.lab{display:flex;flex-direction:column;gap:6px;font:600 .68rem/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

/* Setup */
.form{display:flex;flex-direction:column;gap:14px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{min-height:44px;background:var(--panel-2);border:1px solid var(--line);font:600 .78rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.day[aria-pressed="true"]{border-color:var(--glow);color:var(--glow);background:var(--halo)}

/* Tab bar */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav button{background:none;border:0;min-height:58px;font:600 .74rem/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);position:relative}
.nav button[aria-current="page"]{color:var(--glow)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--glow);box-shadow:0 0 10px var(--glow)}

/* Toasts and overlay */
.toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;flex-direction:column;gap:8px;align-items:center;z-index:20;pointer-events:none}
.toast{max-width:420px;width:100%;background:var(--panel);border:1px solid var(--glow);padding:10px 14px;box-shadow:0 0 18px var(--halo);animation:drop .3s ease-out}
.toast.bad{border-color:var(--bad)}
.toast small{display:block;font:700 .66rem/1 var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--glow);margin-bottom:4px}
.toast.bad small{color:var(--bad)}
.toast.gold{border-color:var(--gold)}
.toast.gold small{color:var(--gold)}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(2,6,14,.9);display:grid;place-items:center;padding:24px}
.lvl{width:100%;max-width:360px;text-align:center;border:1px solid var(--glow);background:var(--panel);padding:32px 20px;box-shadow:0 0 40px var(--halo);animation:pop .5s cubic-bezier(.2,1.2,.3,1)}
.lvl small{font:600 .75rem/1 var(--f-display);letter-spacing:.3em;text-transform:uppercase;color:var(--glow)}
.lvl h2{font:700 3rem/1.05 var(--f-display);text-shadow:0 0 22px var(--glow);margin:14px 0 6px}
.lvl .big{font:700 5rem/1 var(--f-display);color:var(--glow);text-shadow:0 0 28px var(--glow)}
.lvl p{color:var(--mute);margin-top:10px}
.lvl .btn{margin-top:22px}
@keyframes drop{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.stat-row{grid-template-columns:80px minmax(0,1fr) 34px}.title{font-size:1.7rem}}
</style>
</head>
<body>

<div class="shell">
  <div id="hud"></div>
  <main id="view" class="shell" style="padding:0"></main>
</div>
<nav class="nav" id="nav" aria-label="Sections"></nav>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="overlay" id="overlay" hidden></div>

<script>
(()=>{
'use strict';
const LS='level-up-system-v1';
const STAT={BODY:'Body',MIND:'Mind',CONTENT:'Content',WEALTH:'Wealth',DISC:'Discipline'};
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(k,n)=>{const d=pd(k);d.setDate(d.getDate()+n);return dk(d)};
const dow=k=>pd(k).getDay();
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const today=()=>dk(new Date());
const weekStart=k=>addD(k,-((dow(k)+6)%7));
const fmtDay=k=>pd(k).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});

/* ---------- levels ---------- */
const need=L=>Math.round(150*Math.pow(L,1.4));
const cum=L=>{let s=0;for(let i=1;i<L;i++)s+=need(i);return s};
function lvl(xp){let L=1,rem=xp;while(rem>=need(L)){rem-=need(L);L++}return{L,into:rem,need:need(L)}}
const rank=L=>L>=50?'S':L>=35?'A':L>=20?'B':L>=10?'C':L>=5?'D':'E';

/* ---------- state ---------- */
function fresh(){const t=today();return{v:2,name:'Player',startDate:t,nextJudge:t,totalXp:0,
  stats:{BODY:0,MIND:0,CONTENT:0,WEALTH:0,DISC:0},counts:{},days:{},weights:[{d:t,kg:66}],goalKg:80,paceKg:1.5,
  trainDays:[1,2,4,5],age:20,heightCm:184,subs:0,subsGoal:1000,bosses:{},notices:[],bestStreak:0,
  bal:0,balGoal:1000,balAt:t,balPrev:null,
  feel:{},lastBackup:0,updatedAt:0}}
function normalize(o){
  const f=fresh(),s=Object.assign(f,o);
  for(const k of ['stats','counts','days','bosses','feel'])if(!s[k]||typeof s[k]!=='object')s[k]=fresh()[k];
  s.stats=Object.assign({BODY:0,MIND:0,CONTENT:0,WEALTH:0,DISC:0},s.stats);
  if(!Array.isArray(s.weights)||!s.weights.length)s.weights=fresh().weights;
  if(!Array.isArray(s.trainDays))s.trainDays=[1,2,4,5];
  if(!Array.isArray(s.notices))s.notices=[];
  return s;
}
function loadLocal(){try{const r=localStorage.getItem(LS);if(r)return normalize(JSON.parse(r))}catch(e){}return null}
let S=loadLocal()||fresh();
const UI={tab:'quests',open:new Set(),resetArm:false,storeFail:false};
try{localStorage.setItem(LS+'-t','1');localStorage.removeItem(LS+'-t')}catch(e){UI.storeFail=true}

function persist(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S));UI.storeFail=false}catch(e){UI.storeFail=true}
}

/* ---------- coach: plain rules that adapt quests to your history ---------- */
const CORE=['vit','food','train','short','money'];
const QN={vit:'Morning Supplements',food:'Fuel the Bulk',train:'Workout',short:'Post a Short',money:'Income Session'};
const SCALED=['train','short','money'];
const doneOn=(k,id)=>!!(S.days[k]&&S.days[k].done[id]!=null);

/* How often a quest was done in the n days before k (today not counted). Needs 3+ days of history. */
function rateInfo(id,k,n){
  const to=diff(S.startDate,k),from=Math.max(0,to-n),len=to-from;
  if(len<3)return null;
  let d=0;
  for(let i=from;i<to;i++)if(doneOn(addD(S.startDate,i),id))d++;
  return{d,len,r:d/len};
}
const rate=(id,k,n)=>{const x=rateInfo(id,k,n);return x?x.r:null};
/* Below 70% this week: ease back one step. Below 50%: two steps. */
function auto(id,k){const r=rate(id,k,7);return r==null?0:r<.5?-2:r<.7?-1:0}
const tierOf=(id,k)=>Math.floor(Math.max(0,(S.counts[id]||0)-(doneOn(k,id)?1:0))/7);
/* Difficulty step = clears so far / 7, plus your Make harder/easier taps, plus the auto ease. */
function lvlOf(id,k){return Math.max(-3,tierOf(id,k)+(S.feel[id]||0)+auto(id,k))}
/* The quest you do least often (under 70% this week) */
function weak(k){
  let best=null;
  for(const id of CORE){const r=rate(id,k,7);if(r!=null&&r<.7&&(!best||r<best.r))best={id,r}}
  return best;
}
/* Comeback day: yesterday was not a full clear and 2 of the last 3 days were not. Lighter day, bonus XP. */
function comeback(k){
  if(diff(S.startDate,k)<3||allDone(addD(k,-1)))return false;
  let m=0;for(let i=1;i<=3;i++)if(!allDone(addD(k,-i)))m++;
  return m>=2;
}
/* Weight change in kg per week from the last 4 weigh-ins (needs a span of 10+ days) */
function trend(){
  const w=S.weights.slice(-4);
  if(w.length<2)return null;
  const span=diff(w[0].d,w[w.length-1].d);
  if(span<10)return null;
  return(w[w.length-1].kg-w[0].kg)/span*7;
}
function calAdj(){
  const t=trend();
  if(t==null)return{adj:0,t:null,note:''};
  const g=S.paceKg/4.33;
  if(t<0)return{adj:250,t,note:'Weight is dropping'};
  if(t<g*.5)return{adj:150,t,note:'Gaining slower than planned'};
  if(t>g*1.6)return{adj:-150,t,note:'Gaining faster than planned'};
  return{adj:0,t,note:'On pace'};
}
function dowStats(k){
  const t=Array.from({length:7},()=>[0,0]);
  for(let c=S.startDate;c<k;c=addD(c,1)){const w=dow(c);t[w][1]++;if(allDone(c))t[w][0]++}
  return t;
}

/* ---------- quests ---------- */
function nutrition(k){
  const kg=S.weights[S.weights.length-1].kg,train=S.trainDays.includes(dow(k));
  const bmr=10*kg+6.25*(S.heightCm||184)-5*(S.age||20)+5;
  const base=Math.max(200,Math.min(500,S.paceKg*7700/30.4));
  const ca=calAdj();
  const surplus=kg>=S.goalKg?0:Math.max(100,Math.min(750,base+ca.adj));
  const kcal=Math.round((bmr*(train?1.55:1.4)+surplus)/10)*10;
  const prot=Math.round(1.8*kg);
  return{kcal,prot,meal:Math.round(kcal*.25/10)*10,snack:Math.round(kcal*.125/10)*10,pm:Math.round(prot*.25/5)*5,ps:Math.round(prot*.125/5)*5,train,adj:ca.adj,t:ca.t,note:ca.note};
}
const GROW=['Study one successful Shorts channel in your niche and note what they repeat','Draft 3 Short ideas that could bring in subscribers',
  'Review what got views this week and plan the next step','Check your channel progress toward monetization in YouTube Studio'];
const EARN=['Brainstorm 5 ways to earn on the side','Pick one side-income idea and write how you would test it this week',
  'Learn one skill that earns: editing, thumbnails, copywriting or freelancing','Write down 3 things you could offer someone for money this month'];
const REVIEW='Weekly review: check YouTube Studio, note what worked, plan next week’s 3 Short ideas';
/* Growth topics first while the channel is under half its subscriber target, earning topics after that. */
function focusFor(k,idx){
  if(dow(k)===0)return REVIEW;
  const stage=S.subsGoal>0?S.subs/S.subsGoal:0;
  const main=stage<.5?GROW:EARN,other=stage<.5?EARN:GROW;

}

function bookFor(idx){
  const total=BOOKS.reduce((s,b)=>s+b.w,0);
  let wk=Math.floor(Math.max(0,idx)/7)%total;
  for(const b of BOOKS){if(wk<b.w)return{b,wk:wk+1};wk-=b.w}
  return{b:BOOKS[0],wk:1};
}

function allDone(k){return reqIds(k).every(q=>doneOn(k,q.id))}
function streakPrev(k){let n=0,c=addD(k,-1);while(c>=S.startDate&&allDone(c)){n++;c=addD(c,-1)}return n}
function streak(){const k=today();const n=streakPrev(k)+(allDone(k)?1:0);if(n>S.bestStreak)S.bestStreak=n;return n}

function weekTally(ws){
  const from=ws<S.startDate?S.startDate:ws,to=addD(ws,6);
  const t={vit:[0,0],train:[0,0],short:[0,0]};
  for(let c=from;c<=to;c=addD(c,1)){
    t.vit[1]++;t.vit[0]+=doneOn(c,'vit')?1:0;
    t.short[1]++;t.short[0]+=doneOn(c,'short')?1:0;
    t.train[1]++;t.train[0]+=doneOn(c,'train')?1:0;
  }
  const done=t.vit[0]+t.short[0]+t.train[0],total=t.vit[1]+t.short[1]+t.train[1];
  return{...t,done,total,goal:Math.ceil(total*0.8)};
}
function judgeWeek(ws){
  const t=weekTally(ws);
  if(!t.total)return;
  const won=t.done>=t.goal;
  S.bosses[ws]={won,done:t.done,total:t.total};
  if(won){S.totalXp+=150;S.stats.DISC+=3;S.notices.push({boss:true,ws,done:t.done,total:t.total})}
}
/* Vault: every Sunday the savings balance pays XP. 10 base, up to 30 more as the balance nears the goal, +15 if it grew.
   Capped at 55 a week so it can never outrun the daily quests. Pauses if the balance has not been updated for 3 weeks. */
function judgeVault(ws){
  const end=addD(ws,6);
  if(S.balGoal>0&&S.bal>0&&diff(S.balAt,end)<=21){
    const p=Math.min(1,S.bal/S.balGoal),grew=S.balPrev!=null&&S.bal>S.balPrev;
    const xp=Math.round(10+30*p)+(grew?15:0);
    S.totalXp+=xp;S.stats.WEALTH+=1;
    S.notices.push({vault:true,xp,grew,p:Math.round(p*100)});
  }
  S.balPrev=S.bal;
}
function judgeDay(k){
  const d=S.days[k]||{done:{}};
  const missed=reqIds(k).filter(q=>d.done[q.id]==null);
  if(missed.length){
    const pen=Math.min(50,missed.length*10);
    const floor=cum(lvl(S.totalXp).L);
    const lost=Math.max(0,Math.min(pen,S.totalXp-floor));
    S.totalXp-=lost;
    S.notices.push({k,missed:missed.map(q=>q.name),lost});
  }
  if(dow(k)===0){judgeWeek(weekStart(k));judgeVault(weekStart(k))}
}
function rollover(){
  const t=today();
  if(S.nextJudge>=t)return false;
  let c=S.nextJudge<S.startDate?S.startDate:S.nextJudge;
  if(diff(c,t)>400)c=addD(t,-400);
  while(c<t){judgeDay(c);c=addD(c,1)}
  S.nextJudge=t;
  S.notices=S.notices.slice(-8);

/* ---------- backup and restore ---------- */
function backupJson(){return JSON.stringify({app:'level-up-system',v:2,exported:new Date().toISOString(),data:S})}
function backupAge(){
  if(!S.lastBackup)return'No backup saved yet.';
  const d=Math.floor((Date.now()-S.lastBackup)/864e5);
  return d<=0?'Last backup: today.':d===1?'Last backup: yesterday.':'Last backup: '+d+' days ago.';
}
function markBackup(){S.lastBackup=Date.now();persist();render();toast('Backup saved','Keep the file somewhere safe, like Files or Google Drive.')}
async function exportFile(){
  const name='level-up-backup-'+today()+'.json';
  const file=new File([backupJson()],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Level Up backup'});markBackup();return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const url=URL.createObjectURL(file),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
  markBackup();
}
async function copyBackup(){
  try{await navigator.clipboard.writeText(backupJson());markBackup()}
  catch(e){toast('Copy failed','Use Save backup file instead.','bad')}
}
function validBackup(d){
  return !!d&&typeof d==='object'&&Number.isFinite(d.totalXp)&&d.totalXp>=0&&/^\d{4}-\d{2}-\d{2}$/.test(d.startDate||'')&&
    !!d.days&&typeof d.days==='object'&&!!d.stats&&typeof d.stats==='object'&&Array.isArray(d.weights)&&d.weights.length>0&&
    d.weights.every(w=>w&&Number.isFinite(w.kg)&&typeof w.d==='string');
}
function restoreFrom(text){
  let o;
  try{o=JSON.parse(text)}catch(e){toast('Restore failed','That is not a valid backup. Paste all of the text or pick the .json file.','bad');return}
  const d=o&&o.data?o.data:o;
  if(!validBackup(d)){toast('Restore failed','This does not look like a Level Up backup.','bad');return}
  if(!confirm('Replace your current progress with this backup (level '+lvl(d.totalXp).L+', '+d.totalXp+' XP)?'))return;
  S=normalize(d);
  S.nextJudge=today();
  S.lastBackup=Date.now();
  UI.open.clear();persist();render();
  toast('Restored','Progress loaded: level '+lvl(S.totalXp).L+'.');
}

  el.className='toast '+(kind||'');
  el.innerHTML='<small>'+esc(title)+'</small><div>'+esc(msg)+'</div>';
  $('#toasts').appendChild(el);

}
function showLevel(L,rankUp){
  const o=$('#overlay');
  o.innerHTML='<div class="lvl" role="dialog" aria-label="Level up"><small>System</small><h2>LEVEL UP</h2><div class="big num">'+L+'</div>'+
    '<p>'+(rankUp?'Rank '+rank(L)+' reached. Quests get harder.':'Harder quests are coming. Keep going.')+'</p><button class="btn" data-act="closeLvl">Continue</button></div>';
  o.hidden=false;
}
function toggle(qid,weight){
  const k=today();
  const q=questsFor(k).find(x=>x.id===qid);
  if(!q)return;
  const day=S.days[k]||(S.days[k]={done:{},clear:0});
  const before=lvl(S.totalXp).L;
  if(day.done[qid]!=null){
    S.totalXp=Math.max(0,S.totalXp-day.done[qid]);
    S.stats[q.stat]=Math.max(0,S.stats[q.stat]-q.pts);
    S.counts[qid]=Math.max(0,(S.counts[qid]||0)-1);
    delete day.done[qid];
    if(qid==='weigh')S.weights=S.weights.filter(w=>w.d!==k);
  }else{
    const mult=1+Math.min(0.5,0.05*streakPrev(k))+(comeback(k)?0.25:0);
    const x=Math.round(q.xp*mult);
    day.done[qid]=x;
    S.totalXp+=x;
    S.stats[q.stat]+=q.pts;
    S.counts[qid]=(S.counts[qid]||0)+1;
    if(qid==='weigh'){S.weights=S.weights.filter(w=>w.d!==k);S.weights.push({d:k,kg:weight})}
    toast('Quest cleared',q.name+'  +'+x+' XP'+(mult>1?'  (bonus)':''));
  }
  const all=allDone(k);
  if(all&&!day.clear){day.clear=20;S.totalXp+=20;S.stats.DISC+=2;toast('Daily clear','All required quests done  +20 XP','gold')}
  else if(!all&&day.clear){S.totalXp=Math.max(0,S.totalXp-day.clear);S.stats.DISC=Math.max(0,S.stats.DISC-2);day.clear=0}
  const after=lvl(S.totalXp).L;
  persist();
  render();
  if(after>before)showLevel(after,rank(after)!==rank(before));
}
function feedback(id,v){
  const cur=S.feel[id]||0,nxt=Math.max(-3,Math.min(3,cur+v));
  if(nxt===cur){toast('Coach',QN[id]+' is already as '+(v>0?'hard':'easy')+' as the trim goes.');return}
  S.feel[id]=nxt;persist();render();
  toast('Coach',QN[id]+' is '+(v>0?'harder':'easier')+' from now on.');
}

function chart(){
  const w=S.weights.slice(-12);

  const vals=w.map(x=>x.kg);let mn=Math.min(...vals),mx=Math.max(...vals);
  if(mx-mn<2){mx+=1;mn-=1}
  const x=i=>pl+(W-pl-pr)*i/(w.length-1),y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const pts=w.map((p,i)=>x(i).toFixed(1)+','+y(p.kg).toFixed(1)).join(' ');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weight over time">'+
    '<line class="gd" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(mn)+'" y2="'+y(mn)+'"/><line class="gd" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(mx)+'" y2="'+y(mx)+'"/>'+
    '<text class="ax" x="'+(pl-6)+'" y="'+(y(mx)+3)+'" text-anchor="end">'+mx.toFixed(1)+'</text><text class="ax" x="'+(pl-6)+'" y="'+(y(mn)+3)+'" text-anchor="end">'+mn.toFixed(1)+'</text>'+
    '<polyline class="ln" points="'+pts+'"/>'+

    '<text class="ax" x="'+pl+'" y="'+(H-4)+'">'+fmtDay(w[0].d)+'</text><text class="ax" x="'+(W-pr)+'" y="'+(H-4)+'" text-anchor="end">'+fmtDay(w[w.length-1].d)+'</text></svg>';

    '<p class="hint">Your progress is stored in this browser on this phone. Clearing site data, switching browsers or getting a new phone erases it, so save a backup file now and then. Restoring a backup does not penalise the days since it was made. '+backupAge()+'</p>'+
    '<div class="pair" style="margin:0"><button class="btn" data-act="export">Save backup file</button><button class="btn" data-act="copy">Copy backup text</button></div>'+
    '<label class="btn filebtn">Restore from file<input type="file" id="restoreFile" accept=".json,application/json" aria-label="Choose a backup file to restore"></label>'+
    '<textarea class="field" id="pasteBox" rows="3" placeholder="Or paste backup text here" aria-label="Backup text to restore"></textarea>'+
    '<button class="btn" data-act="restorePaste">Restore from pasted text</button></section>'+
    '<section class="panel form"><p class="sec" style="margin:0">Reset</p>'+
    '<p class="hint">Erases all XP, levels, stats and weight history and starts over.</p>'+
    '<button class="btn danger" data-act="reset">'+(UI.resetArm?'Tap again to erase everything':'Reset progress')+'</button></section>';
}
const TABS=[['quests','Quests'],['status','Status'],['boss','Boss'],['setup','Setup']];
function render(){
  $('#hud').innerHTML=hud();
  const v={quests:viewQuests,status:viewStatus,boss:viewBoss,setup:viewSetup}[UI.tab];
  $('#view').innerHTML=v();
  $('#nav').innerHTML=TABS.map(t=>'<button data-act="tab" data-t="'+t[0]+'"'+(UI.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+'</button>').join('');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b)return;
  const a=b.dataset.act;
  if(a==='tab'){UI.tab=b.dataset.t;UI.resetArm=false;render();window.scrollTo(0,0)}
  else if(a==='open'){const id=b.dataset.id;UI.open.has(id)?UI.open.delete(id):UI.open.add(id);render()}
  else if(a==='toggle'){toggle(b.dataset.id)}
  else if(a==='weigh'){const v=parseFloat($('#weighInput').value);if(v>=30&&v<=200)toggle('weigh',Math.round(v*10)/10);else toast('Check the number','Enter your weight in kg, for example 66.4','bad')}
  else if(a==='fb'){feedback(b.dataset.id,+b.dataset.v)}
  else if(a==='export'){exportFile()}
  else if(a==='copy'){copyBackup()}
  else if(a==='restorePaste'){restoreFrom($('#pasteBox').value.trim())}
  else if(a==='dismiss'){S.notices.splice(+b.dataset.i,1);persist();render()}
  else if(a==='closeLvl'){$('#overlay').hidden=true}
  else if(a==='day'){const d=+b.dataset.d,i=S.trainDays.indexOf(d);i>=0?S.trainDays.splice(i,1):S.trainDays.push(d);persist();render()}
  else if(a==='reset'){
    if(!UI.resetArm){UI.resetArm=true;render()}
    else{S=fresh();UI.resetArm=false;UI.open.clear();persist();render();toast('System','Progress reset. A new run begins.')}
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='restoreFile'){
    const f=e.target.files&&e.target.files[0];
    e.target.value='';
    if(!f)return;
    const r=new FileReader();
    r.onload=()=>restoreFrom(String(r.result));
    r.onerror=()=>toast('Restore failed','Could not read that file.','bad');
    r.readAsText(f);
    return;
  }
  const f=e.target.dataset&&e.target.dataset.field;
  if(!f)return;
  let v=e.target.value;
  if(f==='name')S.name=v.trim()||'Player';
  else{
    v=parseFloat(v);
    const zeroOk=f==='subs'||f==='bal';
    if(!(v>0)&&!zeroOk)return render();
    if(zeroOk&&!(v>=0))return render();
    S[f]=v;
    if(f==='bal')S.balAt=today();
  }
  persist();render();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&rollover())render()});

/* ---------- boot ---------- */
rollover();
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>
</body>
</html>
